<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Ofertas — Tech & Promo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module" src="js/app.js"></script>
</head>

<body class="bg-slate-50">
    <div id="app" class="max-w-7xl mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-black text-slate-800 tracking-tight">RADAR <span class="text-blue-600">OFERTAS</span> — Tech &amp; Promo</h1>
            <p class="text-slate-500 mt-2">Ofertas dos canais do Telegram, organizadas por categoria</p>
        </header>

        <!-- Loading -->
        <div v-if="carregando" class="text-center py-20 text-slate-400">Carregando ofertas…</div>

        <template v-else>
            <!-- Chips de categoria (category-first) -->
            <section class="mb-6 flex flex-wrap gap-2 justify-center">
                <button @click="filtroCategoria=''" :class="['chip', filtroCategoria==='' ? 'chip-on' : '']">
                    Todas ({{ itens.length }})
                </button>
                <button v-for="cat in categorias" :key="cat" @click="setCategoria(cat)"
                    :class="['chip', filtroCategoria===cat ? 'chip-on' : '']">
                    {{ cat }} ({{ contagem[cat] || 0 }})
                </button>
            </section>

            <!-- Filtros -->
            <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[260px]">
                    <label class="text-xs font-bold text-slate-400 uppercase ml-1">Buscar</label>
                    <input v-model="busca" type="text" placeholder="Ex: DDR4, RTX 4060, Ryzen, filamento…"
                        class="w-full mt-1 p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <div class="w-full md:w-52">
                    <label class="text-xs font-bold text-slate-400 uppercase ml-1">Canal</label>
                    <select v-model="filtroCanal" class="w-full mt-1 p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500">
                        <option value="">Todos os canais</option>
                        <option v-for="c in canais" :key="c" :value="c">{{ c }}</option>
                    </select>
                </div>
                <div class="w-full md:w-48">
                    <label class="text-xs font-bold text-slate-400 uppercase ml-1">Loja</label>
                    <select v-model="filtroLoja" class="w-full mt-1 p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500">
                        <option value="">Todas as lojas</option>
                        <option v-for="l in lojas" :key="l" :value="l">{{ l }}</option>
                    </select>
                </div>
                <button @click="toggleOrdem()" class="p-3 bg-slate-800 text-white rounded-xl hover:bg-slate-700 transition text-xs font-bold min-w-[140px]">
                    ↕ {{ rotuloOrdem() }}
                </button>
            </section>

            <!-- Contador -->
            <p class="text-sm text-slate-400 mb-4">
                {{ itensFiltrados.length.toLocaleString('pt-BR') }} ofertas
                <span v-if="itensFiltrados.length > itensVisiveis.length">· mostrando {{ itensVisiveis.length }}</span>
            </p>

            <!-- Grid -->
            <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <a v-for="item in itensVisiveis" :key="item.canal + item.id_visual" :href="item.link" target="_blank"
                    rel="noopener" class="card-oferta block">
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-3 gap-2">
                            <span class="badge">{{ item.categoria }}</span>
                            <span class="text-[10px] font-bold text-slate-400 text-right">{{ item.canal }}</span>
                        </div>
                        <h2 class="text-sm font-bold text-slate-800 leading-snug mb-3 line-clamp-3">{{ item.produto }}</h2>
                        <div class="flex items-end justify-between">
                            <div>
                                <p class="text-[10px] text-slate-400 font-bold uppercase">Preço</p>
                                <div class="text-2xl font-black text-emerald-600" v-if="item.preco != null">R$ {{ item.preco.toFixed(2) }}</div>
                                <div class="text-lg font-bold text-slate-400" v-else>ver oferta</div>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] text-slate-400 font-bold uppercase">Loja</p>
                                <p class="text-sm font-bold text-slate-700">{{ item.loja }}</p>
                            </div>
                        </div>
                        <div v-if="item.cupom" class="mt-3">
                            <span class="inline-block bg-amber-100 text-amber-800 text-[11px] font-bold px-2 py-1 rounded-lg">
                                🏷 Cupom: {{ item.cupom }}
                            </span>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-3 border-t border-slate-100 flex justify-between items-center">
                        <span class="text-[10px] font-bold text-slate-400">{{ item.data }}</span>
                        <span class="text-blue-600 text-xs font-bold">Ver oferta →</span>
                    </div>
                </a>
            </main>

            <!-- Mostrar mais -->
            <div v-if="itensFiltrados.length > itensVisiveis.length" class="text-center mt-8">
                <button @click="mais()" class="px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition font-bold">
                    Mostrar mais
                </button>
            </div>

            <!-- Vazio -->
            <div v-if="itensFiltrados.length === 0" class="text-center py-20">
                <p class="text-slate-400 text-lg">Nenhuma oferta encontrada com esses filtros.</p>
            </div>

            <footer class="text-center text-slate-400 text-xs mt-16 border-t border-slate-200 pt-6">
                Ofertas coletadas dos canais públicos do Telegram · atualização manual · use por sua conta e risco.
            </footer>
        </template>
    </div>
</body>

</html>
